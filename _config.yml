# GitHub Pages(Jekyll) 빌드 설정.
# 사이트에 필요 없는 작업 문서·테스트·패키지 파일을 배포에서 뺀다.
# ('_' 또는 '.'으로 시작하는 경로는 Jekyll이 기본으로 제외한다 — _archive/, .claude/ 등)
exclude:
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - SPEC.md
  - SELF_CHECK.md
  - QA_REPORT.md
  - iOS-game-roadmap.md
  - docs/
  - tests/
  - summaries/
  - package.json
  - package-lock.json
  - node_modules/
